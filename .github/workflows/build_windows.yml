name: Flutter Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Flutter Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          cache: true

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Archive build
        shell: pwsh
        run: |
          if (Test-Path "build/windows/x64/runner/Release") {
            Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "KumiteScore-Windows.zip"
          } else {
            Write-Host "❌ build/windows/x64/runner/Release not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KumiteScore-Windows
          path: KumiteScore-Windows.zip
